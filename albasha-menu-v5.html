<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0800"/>
<title>Al Basha Al Mendi Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Tajawal:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.18);
  --gold-shine:linear-gradient(135deg,#b8860b,#f0d060,#b8860b);
  --bg:#0a0800;--bg2:#110e00;--bg3:#1a1500;--bg4:#221c00;
  --text:#f2e8c9;--muted:#7a6a40;--red:#c0392b;
  --border:rgba(201,168,76,.22);--border2:rgba(201,168,76,.1);
  --radius:18px;--radius-sm:10px;
  --shadow:0 8px 40px rgba(0,0,0,.7);
  --font-display:'Cormorant Garamond',serif;
  --font-body:'Tajawal',sans-serif;
  --font-ar:'Amiri',serif;
}
body.light{
  --bg:#faf6ec;--bg2:#fff8e7;--bg3:#f5edcf;--bg4:#eee4c0;
  --text:#2a1f00;--muted:#8a7040;
  --border:rgba(150,110,20,.3);--border2:rgba(150,110,20,.12);
}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);}

/* HEADER */
#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;height:68px;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
  flex-shrink:0;position:relative;z-index:100;
}
#hdr::after{
  content:'';position:absolute;bottom:0;left:8%;right:8%;height:1px;
  background:var(--gold-shine);background-size:200% auto;
  animation:shimmer 4s linear infinite;opacity:.45;
}
.hlogo-wrap{display:flex;flex-direction:row;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.hlogo-img{
  width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2px solid var(--gold);
  box-shadow:0 0 14px rgba(201,168,76,.35),0 2px 8px rgba(0,0,0,.6);
}
.hlogo-text{display:flex;flex-direction:column;justify-content:center;gap:1px;}
.hlogo{
  font-family:var(--font-display);font-size:20px;font-weight:700;
  color:var(--gold2);letter-spacing:3.5px;line-height:1;
  text-shadow:0 1px 10px rgba(201,168,76,.4);
}
body.light .hlogo{color:#6a4a00;}
.hlogo-ar{font-family:var(--font-ar);font-size:12px;color:var(--muted);letter-spacing:1px;}
body.light .hlogo-ar{color:var(--muted);}
.hright{display:flex;align-items:center;gap:8px;}

/* Language */
.glob-btn{
  background:var(--gold3);border:1px solid var(--border);
  color:var(--gold2);padding:6px 14px;font-size:12px;cursor:pointer;
  border-radius:20px;font-family:var(--font-body);
  display:flex;align-items:center;gap:5px;transition:.25s;letter-spacing:.5px;
}
.glob-btn:hover{background:rgba(201,168,76,.28);border-color:var(--gold);}
.lang-drop{
  display:none;position:absolute;top:calc(100% + 8px);right:18px;
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;min-width:190px;z-index:400;
  box-shadow:0 16px 50px rgba(0,0,0,.85);
}
.lang-drop.open{display:block;animation:fadeUp .18s ease;}
.lang-drop button{
  display:block;width:100%;padding:13px 18px;background:transparent;border:none;
  border-bottom:1px solid var(--border2);color:var(--text);
  font-family:var(--font-body);font-size:14px;cursor:pointer;text-align:left;transition:.15s;
}
.lang-drop button:last-child{border-bottom:none;}
.lang-drop button:hover,.lang-drop button.cur{background:var(--gold3);color:var(--gold2);}

/* Theme */
.theme-btn{
  background:var(--gold3);border:1px solid var(--border);
  font-size:15px;width:36px;height:36px;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
}
.theme-btn:hover{background:rgba(201,168,76,.28);}

/* CATEGORY SCREEN */
#cat-screen{flex:1;overflow-y:auto;padding:0 14px 20px;}
#cat-screen::-webkit-scrollbar{width:3px;}
#cat-screen::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.cat-label{
  font-family:var(--font-display);font-size:12px;color:var(--muted);
  letter-spacing:5px;text-transform:uppercase;text-align:center;
  margin-bottom:14px;padding-top:10px;
}
#cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cat-card{
  background:var(--bg2);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:stretch;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
  -webkit-user-select:none;position:relative;overflow:hidden;
  min-height:130px;border:1px solid var(--border2);
}
.cat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,.07) 0%,transparent 60%);
  z-index:0;pointer-events:none;
}
.cat-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gold-shine);background-size:200% auto;
  animation:shimmer 5s linear infinite;opacity:0;transition:.2s;
}
.cat-card:hover::after{opacity:.7;}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(201,168,76,.1);}
.cat-card:active{transform:scale(.97);}
.cat-top-line{
  width:100%;flex:1;display:flex;flex-direction:column;
  justify-content:flex-end;padding:14px 16px 8px;position:relative;z-index:1;
}
.cat-emoji-large{font-size:36px;margin-bottom:6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.cat-top-name{
  font-family:var(--font-display);font-size:18px;font-weight:600;
  color:#fff;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.7);
}
.cat-em{display:none;}
.cat-name{display:none;}
.cat-count{
  font-size:10px;color:rgba(255,255,255,.38);
  padding:0 16px 14px;letter-spacing:2.5px;text-transform:uppercase;
  position:relative;z-index:1;
}
body.light .cat-card{background:#fff8e7;border-color:rgba(180,140,20,.2);}
body.light .cat-top-name{color:#2a1800;text-shadow:none;}
body.light .cat-count{color:rgba(42,24,0,.38);}
body.light .cat-emoji-large{filter:none;}

/* SLIDESHOW */
#sw{position:fixed;inset:0;background:#050400;display:none;touch-action:pan-y;z-index:200;overflow:hidden;}
#sw.show{display:block;}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(100%);transition:opacity .38s ease,transform .38s cubic-bezier(.25,.46,.45,.94);will-change:transform,opacity;}
.slide.active{opacity:1;transform:translateX(0);}
.slide.out-left{opacity:0;transform:translateX(-110%);}
.slide.out-right{opacity:0;transform:translateX(110%);}
.s-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1c1600 0%,#050400 70%);}
.s-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;background:#050400;}
.s-photo-ov{display:none;}
.s-emoji{
  position:absolute;top:0;left:0;right:0;bottom:40%;
  display:flex;align-items:center;justify-content:center;
  font-size:120px;z-index:2;
  filter:drop-shadow(0 4px 24px rgba(201,168,76,.25));
}
.s-ring{display:none;}
.s-overlay{
  position:absolute;bottom:0;left:0;right:0;height:45%;
  background:linear-gradient(to top,rgba(5,4,0,.97) 0%,rgba(5,4,0,.75) 40%,rgba(5,4,0,.2) 75%,transparent 100%);
  z-index:3;
}
.s-overlay.has-photo{
  height:38%;
  background:linear-gradient(to top,rgba(5,4,0,.95) 0%,rgba(5,4,0,.6) 35%,transparent 100%);
}

.s-info{position:absolute;bottom:0;left:0;right:0;padding:0 90px 28px 28px;z-index:5;}
.s-divider{display:none;}
.s-cat-tag{
  display:inline-block;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.5);border-radius:20px;
  padding:3px 12px;margin-bottom:10px;font-family:var(--font-body);
}
.s-name{
  font-family:var(--font-display);font-size:34px;font-weight:700;
  color:#fff;margin-bottom:3px;line-height:1.1;
  text-shadow:0 2px 14px rgba(0,0,0,.9);
}
.s-native{font-size:15px;color:var(--gold);margin-bottom:8px;font-family:var(--font-ar);}
.s-desc{font-size:13px;color:rgba(255,255,255,.48);margin-bottom:16px;line-height:1.6;max-width:380px;}
.s-price-row{display:flex;align-items:baseline;gap:8px;}
.s-price{
  font-family:var(--font-display);font-size:38px;color:var(--gold2);font-weight:700;line-height:1;
  text-shadow:0 1px 12px rgba(201,168,76,.45);
}
.s-price-lbl{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.s-hint{display:none;}

/* Dots */
#dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;pointer-events:none;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(201,168,76,.2);transition:.3s;flex-shrink:0;}
.dot.on{background:var(--gold);width:22px;border-radius:3px;box-shadow:0 0 8px rgba(201,168,76,.5);}

/* Counter */
#big-counter{
  position:absolute;top:18px;right:18px;
  background:rgba(0,0,0,.55);border:1px solid var(--border);
  color:var(--gold2);font-family:var(--font-display);font-size:13px;font-weight:700;
  padding:5px 14px;border-radius:20px;z-index:50;letter-spacing:1px;
}

/* Back button */
#slide-hdr{position:fixed;bottom:28px;right:28px;height:auto;width:auto;background:transparent;border:none;padding:0;display:none;align-items:center;z-index:9999;}
.back-btn{
  background:linear-gradient(135deg,#b8860b,#f0d060);
  border:none;color:#0a0800;width:54px;height:54px;font-size:22px;font-weight:900;
  cursor:pointer;border-radius:50%;
  box-shadow:0 4px 20px rgba(201,168,76,.45),0 2px 10px rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.back-btn:hover{transform:scale(1.06);box-shadow:0 6px 28px rgba(201,168,76,.6);}
#slide-title{font-family:var(--font-display);font-size:15px;color:var(--text);flex:1;}

/* PIN */
#pin-ov{position:fixed;inset:0;background:rgba(5,4,0,.93);backdrop-filter:blur(8px);z-index:600;display:none;align-items:center;justify-content:center;}
#pin-ov.show{display:flex;}
.pin-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:36px;width:310px;text-align:center;
  box-shadow:0 12px 50px rgba(0,0,0,.8);
}
.pin-title{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--gold2);margin-bottom:4px;}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:22px;}
.pin-disp{font-size:32px;letter-spacing:18px;color:var(--gold);height:48px;margin-bottom:22px;text-shadow:0 0 12px rgba(201,168,76,.4);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pk{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  font-size:22px;padding:15px;cursor:pointer;border-radius:10px;
  font-family:var(--font-display);transition:.15s;
}
.pk:hover{border-color:var(--gold);color:var(--gold);background:var(--gold3);}
.pk:active{transform:scale(.94);}
.pin-err{color:var(--red);font-size:13px;margin-top:12px;height:18px;}

/* ADMIN */
#adm-ov{
  position:fixed;inset:0;background:rgba(5,4,0,.9);backdrop-filter:blur(6px);
  z-index:500;display:none;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:16px;
}
#adm-ov.show{display:flex;}
#adm-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:820px;overflow:hidden;box-shadow:var(--shadow);
}
.aph{
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  padding:18px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);position:relative;overflow:hidden;
}
.aph::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--gold-shine);background-size:200% auto;animation:shimmer 4s linear infinite;opacity:.4;
}
.apt{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--gold2);}
.apc{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:17px;transition:.15s;
}
.apc:hover{border-color:var(--red);color:var(--red);}
.ap-tabs{display:flex;border-bottom:1px solid var(--border2);background:var(--bg);}
.ap-tab{
  padding:13px 20px;background:transparent;border:none;color:var(--muted);
  cursor:pointer;font-family:var(--font-body);font-size:14px;
  border-bottom:2px solid transparent;transition:.2s;
}
.ap-tab.on{color:var(--gold2);border-bottom-color:var(--gold);}
.apb{padding:20px;}
.fl{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.fi{
  background:var(--bg);border:1px solid var(--border2);color:var(--text);
  padding:10px 13px;font-family:var(--font-body);font-size:14px;
  border-radius:8px;outline:none;width:100%;transition:.15s;
}
.fi:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.1);}
.fs{
  background:var(--bg);border:1px solid var(--border2);color:var(--text);
  padding:10px 13px;font-family:var(--font-body);font-size:14px;
  border-radius:8px;outline:none;width:100%;
}
.fr{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.fc{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px;}
.bg{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#0a0800;border:none;padding:10px 22px;
  font-family:var(--font-body);font-size:14px;font-weight:700;
  cursor:pointer;border-radius:8px;transition:.2s;
}
.bg:hover{box-shadow:0 4px 16px rgba(201,168,76,.35);}
.bo{
  background:transparent;color:var(--muted);border:1px solid var(--border2);
  padding:8px 13px;font-family:var(--font-body);font-size:12px;cursor:pointer;border-radius:7px;transition:.15s;
}
.bo:hover{border-color:var(--gold);color:var(--gold);}
.bd{
  background:transparent;color:var(--red);border:1px solid var(--red);
  padding:8px 13px;font-family:var(--font-body);font-size:12px;cursor:pointer;border-radius:7px;transition:.15s;
}
.bd:hover{background:var(--red);color:#fff;}
.st{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin:18px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border2);}
.item-card{background:var(--bg);border:1px solid var(--border2);border-radius:12px;padding:15px;margin-bottom:10px;}
.ic-top{display:flex;gap:12px;margin-bottom:12px;}
.ic-photo{width:82px;height:82px;min-width:82px;background:var(--bg3);border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:.15s;position:relative;}
.ic-photo:hover{border-color:var(--gold);}
.ic-fields{flex:1;display:flex;flex-direction:column;gap:6px;}
.ic-langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ic-actions{display:flex;gap:8px;}
.ord-btn{
  background:var(--bg3);border:1px solid var(--border2);color:var(--muted);
  width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;padding:0;transition:.15s;
}
.ord-btn:disabled{opacity:.2;cursor:not-allowed;}
.ord-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}

/* Admin card classes used in JS */
.adm-section{margin-bottom:24px;}
.adm-section-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--gold2);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border2);}
.adm-form{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.adm-row{display:flex;gap:10px;flex-wrap:wrap;}
.adm-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px;}
.adm-field label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.adm-sm{max-width:140px;}
.adm-lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.adm-card{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:12px;transition:.15s;}
.adm-card:hover{border-color:var(--border);}
.adm-card-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.adm-order-btns{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;}
.ord-num{font-size:11px;color:var(--muted);}
.adm-photo-box{width:80px;height:80px;min-width:80px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:.15s;}
.adm-photo-box:hover{border-color:var(--gold);}
.adm-photo-img{width:100%;height:100%;object-fit:cover;}
.adm-photo-del{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.adm-photo-empty{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.adm-main-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
.adm-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.adm-card-actions{display:flex;gap:10px;}
.adm-save-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#0a0800;border:none;padding:9px 20px;border-radius:8px;
  font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;
}
.adm-save-btn:hover{box-shadow:0 4px 14px rgba(201,168,76,.35);}
.adm-del-btn{
  background:transparent;border:1px solid var(--red);color:var(--red);
  padding:9px 20px;border-radius:8px;font-family:var(--font-body);font-size:13px;cursor:pointer;transition:.15s;
}
.adm-del-btn:hover{background:var(--red);color:#fff;}

/* Light mode */
body.light #hdr{background:linear-gradient(180deg,#fffdf5 0%,#faf6ec 100%);border-bottom-color:rgba(180,140,20,.25);}
body.light .cat-card{background:#fff8e7;}
body.light .cat-name{color:#2a1800;}
body.light #cat-screen{background:#faf6ec;}
body.light .s-bg{background:radial-gradient(ellipse at 50% 30%,#1c1600 0%,#050400 70%);}
body.light #slide-title{color:var(--text);}
body.light .lang-drop{background:#fffdf5;border-color:rgba(180,140,20,.3);}
body.light .lang-drop button{color:#2a1800;border-bottom-color:rgba(180,140,20,.12);}
body.light .lang-drop button:hover{background:#fff8e7;color:#8a6010;}
body.light .pin-box,body.light #adm-panel{background:#fffdf5;}
body.light .aph{background:linear-gradient(135deg,#fff8e7,#fffdf5);}
body.light .fi,body.light .fs{background:#fff8e7;color:#2a1800;border-color:rgba(180,140,20,.2);}
body.light .item-card{background:#fff8e7;border-color:rgba(180,140,20,.15);}
body.light .irn{color:#2a1800;}
body.light #big-counter{background:rgba(0,0,0,.65);}
body.light .adm-card{background:#fff8e7;}
body.light .adm-photo-box{background:#faf6ec;}

/* Toast */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#0a0800;padding:10px 26px;border-radius:8px;font-size:14px;font-weight:700;
  opacity:0;transition:.3s;z-index:1000;pointer-events:none;
  box-shadow:0 4px 20px rgba(201,168,76,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

[dir="rtl"] .s-info{text-align:right;}
[dir="rtl"] .lang-drop button{text-align:right;}


/* ══ COMPACT ITEM LIST ══ */
.il-row{
  display:flex;align-items:center;gap:10px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;
  transition:.15s;
}
.il-row:hover{border-color:var(--border);background:var(--bg4);}
.il-drag{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:26px;}
.il-thumb{
  width:52px;height:52px;min-width:52px;border-radius:10px;
  background:var(--bg2);border:1px solid var(--border2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.il-info{flex:1;min-width:0;}
.il-name{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.il-cat{font-size:11px;color:var(--muted);margin-top:1px;}
.il-price{font-size:13px;color:var(--gold);font-weight:700;margin-top:3px;}
.il-actions{display:flex;gap:8px;flex-shrink:0;}
.il-edit-btn{
  background:var(--gold3);border:1px solid var(--border);
  color:var(--gold2);width:36px;height:36px;border-radius:8px;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.il-edit-btn:hover{background:rgba(201,168,76,.3);border-color:var(--gold);}
.il-del-btn{
  background:transparent;border:1px solid rgba(192,57,43,.4);
  color:var(--red);width:36px;height:36px;border-radius:8px;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.il-del-btn:hover{background:var(--red);color:#fff;border-color:var(--red);}

/* ══ EDIT MODAL ══ */
#edit-modal{
  display:none;position:fixed;inset:0;
  background:rgba(5,4,0,.92);backdrop-filter:blur(8px);
  z-index:700;align-items:center;justify-content:center;padding:16px;
  overflow-y:auto;
}
#edit-modal.show{display:flex;}
#edit-modal-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:640px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.9);
  animation:fadeUp .2s ease;
}
.em-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border-bottom:1px solid var(--border);position:relative;overflow:hidden;
}
.em-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--gold-shine);background-size:200% auto;animation:shimmer 4s linear infinite;opacity:.4;
}
.em-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--gold2);}
.em-close{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;transition:.15s;
}
.em-close:hover{border-color:var(--red);color:var(--red);}
#edit-modal-body{padding:20px;display:flex;flex-direction:column;gap:16px;}
.em-top{display:flex;gap:14px;align-items:flex-start;}
.em-photo{
  width:100px;height:100px;min-width:100px;border-radius:12px;
  background:var(--bg3);border:1px dashed var(--border);
  cursor:pointer;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;text-align:center;
}
.em-photo:hover{border-color:var(--gold);}
.em-photo-del{
  position:absolute;top:4px;right:4px;background:var(--red);
  color:#fff;border:none;border-radius:50%;width:22px;height:22px;
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  z-index:2;
}
.em-right{flex:1;display:flex;flex-direction:column;gap:10px;}
.em-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.em-footer{display:flex;gap:10px;padding-top:4px;}
body.light #edit-modal-panel{background:#fffdf5;}
body.light .em-header{background:linear-gradient(135deg,#fff8e7,#fffdf5);}
body.light .il-row{background:#fff8e7;border-color:rgba(180,140,20,.15);}
body.light .il-row:hover{background:#fff4d6;}
body.light .em-photo{background:#faf6ec;}

function loadSlides(cid){
  curIdx=0;
  const con=document.getElementById('slides-container');

  const items=getItems(cid);
  const cat=DB.cats.find(c=>c.id===cid);
  const em=EMOJIS[cat?cat.n:'']||'🍽';
  con.innerHTML=''; dotsEl.innerHTML='';
  if(!items.length){
    con.innerHTML=`<div class="slide active" style="display:flex;align-items:center;justify-content:center;"><div class="s-bg"></div><div style="position:relative;z-index:3;color:var(--muted);">${UI[lang].empty}</div></div>`;
    document.getElementById('big-counter').textContent='';
    return;
  }
  items.forEach((item,i)=>{
    const sl=document.createElement('div');
    sl.className='slide'+(i===0?' active':'');
    const nat=getName(item);
    const pr=item.p>0?item.p.toLocaleString():'—';
    const prl=item.p>0?UI[lang].birr:'';
    const desc=item.desc||'';
    const catName=DB.cats.find(c=>c.id===item.c);
    sl.innerHTML=`
      <div class="s-bg"></div>
      ${item.photo?`<img class="s-photo" src="${item.photo}"/>`:`<div class="s-emoji">${em}</div>`}
      <div class="s-overlay${item.photo?' has-photo':''}"></div>
      <div class="s-info">
        ${catName?`<div class="s-cat-tag">${catName.n}</div>`:''}
        <div class="s-name">${item.n}</div>
        ${nat!==item.n?`<div class="s-native">${nat}</div>`:''}
        ${desc?`<div class="s-desc">${desc}</div>`:''}
        <div class="s-price-row">
          <div class="s-price">${pr}</div>
          ${prl?`<div class="s-price-lbl">${prl}</div>`:''}
        </div>
      </div>`;
    con.appendChild(sl);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' on':'');
    dotsEl.appendChild(dot);
  });
  updateCounter(items.length);
  initSwipe();
}

function updateCounter(total){
  if(total===undefined) total=curCat?getItems(curCat).length:0;
  const bc=document.getElementById('big-counter');
  if(bc) bc.textContent=total>0?`${curIdx+1} / ${total}`:'';
}

function goTo(n){
  if(!curCat) return;
  const items=getItems(curCat);
  const total=items.length;
  if(!total) return;
  const prev=curIdx;
  n=((n%total)+total)%total;
  if(n===prev) return;
  const slides=document.querySelectorAll('#slides-container .slide');
  const dots=document.querySelectorAll('#dots .dot');
  let goRight;
  if(prev===total-1&&n===0) goRight=true;
  else if(prev===0&&n===total-1) goRight=false;
  else goRight=(n>prev);
  slides[prev].classList.remove('active');
  slides[prev].classList.add(goRight?'out-left':'out-right');
  const ps=prev;
  setTimeout(()=>{if(slides[ps])slides[ps].classList.remove('out-left','out-right');},420);
  curIdx=n;
  const inc=slides[curIdx];
  inc.style.transition='none';
  inc.style.transform=goRight?'translateX(100%)':'translateX(-100%)';
  inc.style.opacity='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    inc.style.transition='';
    inc.classList.add('active');
    inc.style.transform='';
    inc.style.opacity='';
  }));
  dots.forEach((d,i)=>d.classList.toggle('on',i===curIdx));
  updateCounter(total);
}

// ── SWIPE ─────────────────────────────────────────
function initSwipe(){
  const el=document.getElementById('sw');
  // clone to remove old listeners
  const fresh=el.cloneNode(false);
  while(el.firstChild) fresh.appendChild(el.firstChild);
  el.parentNode.replaceChild(fresh,el);
  const sw=document.getElementById('sw');

  let sx=0,sy=0,stime=0,locked=null;

  sw.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX;
    sy=e.touches[0].clientY;
    stime=Date.now();
    locked=null;
  },{passive:true});

  sw.addEventListener('touchmove',e=>{
    if(locked===null){
      const dx=Math.abs(e.touches[0].clientX-sx);
      const dy=Math.abs(e.touches[0].clientY-sy);
      if(dx>dy&&dx>8){ locked='h'; e.preventDefault(); }
      else if(dy>dx&&dy>8){ locked='v'; }
    } else if(locked==='h'){
      e.preventDefault();
    }
  },{passive:false});

  sw.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    const dt=Date.now()-stime;
    const absDx=Math.abs(dx);
    const absDy=Math.abs(dy);

    if(locked==='h'){
      // horizontal swipe → next/prev item
      if(absDx>30||(absDx>15&&dt<250)){
        dx<0?goTo(curIdx+1):goTo(curIdx-1);
      }
    } else if(locked==='v'||locked===null){
      // vertical swipe up or down → go back
      if(absDy>60&&dt<500){
        goBack();
      }
    }
  },{passive:true});
}

function uploadPhotoModal(id,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=2400;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const comp=cv.toDataURL('image/jpeg',.95);
      const it=DB.items.find(i=>i.id===id);
      if(it){it.photo=comp;try{save();openEditModal(id);toast('✅ Photo saved!');}catch(e){toast('⚠️ Storage full!');}}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

  const tmp=DB.items[idx];

  DB.items[newIdx]=tmp;
  save();rIL();
}

function uploadPhoto(id,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=2400;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const comp=cv.toDataURL('image/jpeg',.95);
      const item=DB.items.find(i=>i.id===id);
      if(item){item.photo=comp;try{save();rIL();toast('✅ Photo saved! ('+Math.round(comp.length/1024)+'KB)');}catch(e){toast('⚠️ Storage full!');}}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function addItem(){
  const n=document.getElementById('ni-n').value.trim();
  const p=parseInt(document.getElementById('ni-p').value)||0;
  const c=document.getElementById('ni-c').value;
  const d=document.getElementById('ni-d').value.trim();
  const am=document.getElementById('ni-am').value.trim();
  const om=document.getElementById('ni-om').value.trim();
  const ar=document.getElementById('ni-ar').value.trim();
  const so=document.getElementById('ni-so').value.trim();
  if(!n){toast('Enter item name');return;}
  const id='i'+Date.now();
  DB.items.push({id,c,n,p,desc:d});
  if(am||om||ar||so) DB.tr[id]={am,om,ar,so};
  save();rIL();toast('Item added!');
  ['ni-n','ni-p','ni-d','ni-am','ni-om','ni-ar','ni-so'].forEach(x=>{const el=document.getElementById(x);if(el)el.value='';});
}

function saveItem(id){
  const item=DB.items.find(i=>i.id===id);if(!item)return;
  item.n=document.getElementById('en-'+id).value.trim()||item.n;
  item.p=parseInt(document.getElementById('pr-'+id).value)||0;
  item.c=document.getElementById('ca-'+id).value;
  item.desc=document.getElementById('de-'+id).value.trim();
  DB.tr[id]={
    am:document.getElementById('am-'+id).value.trim(),
    om:document.getElementById('om-'+id).value.trim(),
    ar:document.getElementById('ar-'+id).value.trim(),
    so:document.getElementById('so-'+id).value.trim()
  };
  save();toast('✅ Saved: '+item.n);
}

function delItem(id){
  if(!confirm('Delete this item?'))return;
  DB.items=DB.items.filter(i=>i.id!==id);
  delete DB.tr[id];
  save();rIL();toast('Deleted');
}

function rCats(b){
  b.innerHTML=`
    <div class="adm-section">
      <div class="adm-section-title">➕ Add Category</div>
      <div class="adm-form">
        <div class="adm-row">
          <div class="adm-field"><label>Category Name</label><input class="fi" id="nc-n" placeholder="e.g. Desserts"/></div>
        </div>
        <button class="bg" onclick="addCat()">+ Add Category</button>
      </div>
    </div>
    <div class="adm-section">
      <div class="adm-section-title">All Categories</div>
      <div id="cl"></div>
    </div>`;
  rCL();
}
function rCL(){
  const el=document.getElementById('cl');if(!el)return;
  const total=DB.cats.length;
  el.innerHTML=DB.cats.map((cat,idx)=>{
    const cnt=getItems(cat.id).length;
    return `<div class="adm-card">
      <div class="adm-card-header">
        <div class="adm-order-btns">
          <button class="ord-btn" onclick="moveCat(${idx},-1)" ${idx===0?'disabled':''}>▲</button>
          <span class="ord-num">${idx+1}</span>
          <button class="ord-btn" onclick="moveCat(${idx},1)" ${idx===total-1?'disabled':''}>▼</button>
        </div>
        <div class="adm-photo-box" onclick="triggerCatPhoto('${cat.id}')">
          ${cat.photo
            ? `<img src="${cat.photo}" class="adm-photo-img"/>
               <button class="adm-photo-del" onclick="removeCatPhoto('${cat.id}');event.stopPropagation();">✕</button>`
            : `<div class="adm-photo-empty"><div>📷</div><div>Photo</div></div>`}
          <input type="file" accept="image/*" id="cph-${cat.id}" style="display:none" onchange="uploadCatPhoto('${cat.id}',this)"/>
        </div>
        <div class="adm-main-fields" style="flex:1;">
          <div class="adm-field"><label>Category Name</label><input class="fi" id="cn-${cat.id}" value="${cat.n}"/></div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;">${cnt} items inside</div>
        </div>
      </div>
      <div class="adm-card-actions">
        <button class="adm-save-btn" onclick="saveCat('${cat.id}')">💾 Save</button>
        <button class="adm-del-btn" onclick="delCat('${cat.id}')">🗑 Delete</button>
      </div>
    </div>`;
  }).join('');
}

function moveCat(idx,dir){
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=DB.cats.length)return;
  const tmp=DB.cats[idx];
  DB.cats[idx]=DB.cats[newIdx];
  DB.cats[newIdx]=tmp;
  save();rCL();
}

function removeCatPhoto(id){
  const cat=DB.cats.find(c=>c.id===id);
  if(cat){delete cat.photo;save();rCL();toast('Photo removed');}
}

function triggerCatPhoto(id){document.getElementById('cph-'+id).click();}
function uploadCatPhoto(id,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=2400;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const comp=cv.toDataURL('image/jpeg',.95);
      const cat=DB.cats.find(c=>c.id===id);
      if(cat){cat.photo=comp;try{save();rCL();toast('✅ Category photo saved!');}catch(e){toast('⚠️ Storage full!');}}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function addCat(){
  const n=document.getElementById('nc-n').value.trim();
  if(!n){toast('Enter name');return;}
  DB.cats.push({id:'c'+Date.now(),n});
  save();rCL();toast('Category added!');
  document.getElementById('nc-n').value='';
}
function saveCat(id){
  const c=DB.cats.find(x=>x.id===id);if(!c)return;
  const n=document.getElementById('cn-'+id).value.trim();
  if(!n){toast('Name cannot be empty');return;}
  c.n=n;save();rCL();toast('Category saved!');
}
function delCat(id){
  if(getItems(id).length){toast('Move or delete items first!');return;}
  if(!confirm('Delete this category?'))return;
  DB.cats=DB.cats.filter(c=>c.id!==id);
  save();rCL();toast('Deleted');
}

window.addEventListener('DOMContentLoaded',()=>{
  // restore theme
  if(localStorage.getItem('albasha_theme')==='light'){
    isLight=true;
    document.body.classList.add('light');
    document.getElementById('theme-btn').textContent='🌙';
  }

  // double tap logo → admin
  let lastTap=0;
  const logoEl=document.getElementById('logo-tap');
  if(logoEl){
    logoEl.addEventListener('click',()=>{
      const now=Date.now();
      if(now-lastTap<400){ openPin(); }
      lastTap=now;
    });
  }

  buildGrid();
  showCats();
});
